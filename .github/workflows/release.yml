name: Publicar versão (.exe)

# Publica uma Release automaticamente a cada push em main (e também ao criar uma tag à mão).
#   * Push em main: versão = VERSAO_BASE + número da execução (ex.: 2.13.7). Para uma versão
#     "maior" (2.14, 3.0...), troque VERSAO_BASE abaixo.
#   * Tag vX.Y.Z (ou X.Y.Z) enviada à mão: usa a versão da tag.
#   * Run workflow (manual): só gera o .exe como arquivo de download do Actions, SEM Release.
# Todos os testes são OBRIGATÓRIOS: se algum falhar, nada é publicado.
# Pushes que mudam só documentação (*.md, docs/) não publicam versão.
on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:

permissions:
  contents: write   # necessário para publicar a versão (Release)

# Dois pushes seguidos: o segundo espera o primeiro terminar (versões nunca se atropelam).
concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSAO_BASE: "2.13"      # maior.menor; o terceiro número é o da execução (sobe sozinho)

jobs:
  testes:
    uses: ./.github/workflows/ci.yml

  publicar:
    needs: testes
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      # Decide a versão: a da tag (se foi uma tag) ou VERSAO_BASE.<número da execução>.
      # O número da execução só cresce, então toda versão nova é maior que a anterior
      # (o programa instalado só se atualiza para versões maiores).
      - name: Definir a versão
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            $versao = "${{ github.ref_name }}".TrimStart("v")
            $tag = "${{ github.ref_name }}"
          } else {
            $versao = "${{ env.VERSAO_BASE }}.${{ github.run_number }}"
            $tag = "v$versao"
          }
          "VERSAO=$versao" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "TAG=$tag" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "Versão: $versao (tag $tag)"

      # A versão mostrada no programa vira a calculada acima.
      - name: Ajustar a versão do programa
        run: |
          $versao = $env:VERSAO
          (Get-Content anotacoes/theme.py -Encoding UTF8) -replace '^VERSAO = ".*"', "VERSAO = `"$versao`"" | Set-Content anotacoes/theme.py -Encoding UTF8
          Select-String -Path anotacoes/theme.py -Pattern '^VERSAO'

      - name: Instalar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Gerar o executável com PyInstaller
        run: |
          $opcoes = @(
            "--noconfirm", "--clean", "--onefile", "--windowed",
            "--name", "Anotacoes",
            "--collect-all", "customtkinter",
            "--hidden-import", "cryptography.hazmat.primitives.ciphers.aead",
            "--hidden-import", "PIL._tkinter_finder"
          )
          if (Test-Path "assets/icone.ico") { $opcoes += @("--icon", "assets/icone.ico", "--add-data", "assets/icone.ico;.") }
          if (Test-Path "assets/logo.png")  { $opcoes += @("--add-data", "assets/logo.png;.") }
          python -m PyInstaller @opcoes main.py
          if (-not (Test-Path "dist\Anotacoes.exe")) { throw "O .exe não foi gerado." }
          # Cópia com o nome antigo: os programas instalados até a v2.11.x procuram por ele
          # ao se atualizar. Pode ser removida quando todos estiverem na versão nova.
          Copy-Item "dist\Anotacoes.exe" "dist\AnotacoesHospitalares.exe"

      # Abre o programa por alguns segundos para ver se ele fecha sozinho
      # (sintoma de arquivos faltando no pacote). OBRIGATÓRIO: falhou, não publica.
      - name: Testar se o executável abre
        run: |
          $p = Start-Process -FilePath "dist\Anotacoes.exe" -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "O executável fechou sozinho (código $($p.ExitCode))." }
          Stop-Process -Id $p.Id -Force
          Write-Host "O executável abriu e permaneceu em execução."

      # Instalador (atalhos na Área de Trabalho e no Menu Iniciar, desinstalador). Usa o Inno Setup
      # do próprio runner; se não houver, tenta instalar. Não bloqueia a entrega do .exe solto.
      - name: Gerar o instalador (Inno Setup)
        continue-on-error: true
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          if (-not (Test-Path $iscc)) { throw "Inno Setup não encontrado." }
          & $iscc "/DAppVersao=$env:VERSAO" "installer\anotacoes.iss"
          if (-not (Test-Path "dist\Anotacoes-Instalador.exe")) { throw "O instalador não foi gerado." }

      - name: Calcular a assinatura SHA-256 (para auditoria da TI)
        run: |
          $hash = (Get-FileHash "dist\Anotacoes.exe" -Algorithm SHA256).Hash
          # Os dois arquivos são idênticos, então têm o mesmo SHA-256.
          @("$hash  Anotacoes.exe", "$hash  AnotacoesHospitalares.exe") | Out-File -Encoding ascii "dist\SHA256.txt"
          if (Test-Path "dist\Anotacoes-Instalador.exe") {
            $h2 = (Get-FileHash "dist\Anotacoes-Instalador.exe" -Algorithm SHA256).Hash
            "$h2  Anotacoes-Instalador.exe" | Out-File -Encoding ascii -Append "dist\SHA256-instalador.txt"
          }
          Write-Host "SHA-256: $hash"

      - name: Guardar o executável (download na aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Anotacoes-windows
          path: |
            dist/Anotacoes.exe
            dist/AnotacoesHospitalares.exe
            dist/Anotacoes-Instalador.exe
            dist/SHA256.txt
            dist/SHA256-instalador.txt
          if-no-files-found: error
          retention-days: 30

      # Em push (main ou tag): publica o .exe e a assinatura numa Release.
      # É daí que o programa instalado busca as atualizações.
      - name: Publicar a versão (Release)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: |
            dist/Anotacoes.exe
            dist/AnotacoesHospitalares.exe
            dist/Anotacoes-Instalador.exe
            dist/SHA256.txt
            dist/SHA256-instalador.txt
          generate_release_notes: true
