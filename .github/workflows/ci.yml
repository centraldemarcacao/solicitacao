name: Testes (CI)

# Roda a cada envio para main, em pull requests e quando chamado pela publicação (release.yml).
# NÃO gera nem publica o .exe: isso é feito só em tags (veja release.yml).
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testes (Python ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Rodar os testes de unidade
        run: python -m unittest discover -s tests -t . -v

  interface:
    name: Interface (simulação e Tk real)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      # Simula a interface sem tela (valida widgets e fluxos).
      - name: Simular a interface (sem tela)
        run: python tests/interface/simulacao_interface.py
      # Abre a janela de verdade (Tk real) e percorre páginas, diálogos e o bloqueio por PIN.
      - name: Testar a interface de verdade (Tk real)
        run: python tests/interface/fumaca_tk_real.py
